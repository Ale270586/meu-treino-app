<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Treino Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981', /* Novo verde Esmeralda vibrante e moderno */
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              accent: '#00e676'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #059669;
      border-radius: 4px;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto w-full min-h-screen flex flex-col relative pb-20">

    <!-- LOGIN / REGISTER MODAL -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-center px-6 py-12">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/10 text-brand-400 mb-4 border border-brand-500/20 shadow-lg shadow-brand-500/10">
          <i class="ph-bold ph-barbell text-3xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Meu Treino Pro</h1>
        <p class="text-slate-400 text-sm mt-1" id="authSubtitle">Acesse sua ficha de treinos personalizada</p>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">E-mail</label>
          <div class="relative">
            <i class="ph-bold ph-envelope absolute left-4 top-3.5 text-slate-500"></i>
            <input type="email" id="authEmail" required placeholder="seu@email.com" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Senha</label>
          <div class="relative">
            <i class="ph-bold ph-lock-key absolute left-4 top-3.5 text-slate-500"></i>
            <input type="password" id="authPassword" required minlength="6" placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-sm">
          </div>
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/20 transition duration-200 flex items-center justify-center space-x-2 text-sm">
          <span>Entrar no App</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>

      <div class="mt-6 text-center">
        <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-xs text-brand-400 hover:text-brand-300 font-medium transition">
          Não tem uma conta? Cadastre-se
        </button>
      </div>
    </div>

    <!-- MAIN APP HEADER -->
    <header class="p-5 glass-card sticky top-0 z-30 border-b border-slate-800/80">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="openProfileModal()">
          <div class="relative">
            <img id="userAvatarHeader" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-12 h-12 rounded-full object-cover border-2 border-brand-500 p-0.5 shadow-md">
            <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-brand-500 border-2 border-slate-900 rounded-full"></div>
          </div>
          <div>
            <span class="text-xs font-medium text-slate-400 block">Bem-vindo(a)</span>
            <h2 id="userNameHeader" class="text-base font-bold text-white truncate max-w-[160px]">Carregando...</h2>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="openProfileModal()" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 flex items-center justify-center text-slate-300 transition">
            <i class="ph-bold ph-user-gear text-lg"></i>
          </button>
          <button onclick="logout()" class="w-9 h-9 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 flex items-center justify-center transition border border-red-500/20">
            <i class="ph-bold ph-sign-out text-lg"></i>
          </button>
        </div>
      </div>

      <!-- WORKOUT TABS (A, B, C, D, E, F, G) -->
      <div class="flex space-x-2 mt-5 overflow-x-auto custom-scrollbar pb-1 -mx-2 px-2">
        <button onclick="selectWorkoutTab('A')" id="tab-A" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-brand-500 text-slate-950 shadow-lg shadow-brand-500/20">A</button>
        <button onclick="selectWorkoutTab('B')" id="tab-B" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">B</button>
        <button onclick="selectWorkoutTab('C')" id="tab-C" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">C</button>
        <button onclick="selectWorkoutTab('D')" id="tab-D" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">D</button>
        <button onclick="selectWorkoutTab('E')" id="tab-E" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">E</button>
        <button onclick="selectWorkoutTab('F')" id="tab-F" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">F</button>
        <button onclick="selectWorkoutTab('G')" id="tab-G" class="workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white">G</button>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="p-5 space-y-4 flex-1">
      <div class="flex items-center justify-between mb-2">
        <div>
          <h3 class="text-lg font-extrabold text-white flex items-center gap-2">
            <span>Treino <span id="currentWorkoutLabel" class="text-brand-400">A</span></span>
          </h3>
          <p class="text-xs text-slate-400">Lista de exercícios da sua ficha atual</p>
        </div>
        <button onclick="openExerciseModal()" class="bg-brand-500/10 hover:bg-brand-500/20 text-brand-400 border border-brand-500/30 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
          <i class="ph-bold ph-plus"></i>
          <span>Add Exercício</span>
        </button>
      </div>

      <!-- EXERCISES LIST -->
      <div id="exerciseList" class="space-y-3">
        <!-- Renderizado Dinamicamente -->
      </div>
    </main>

    <!-- PROFILE MODAL -->
    <div id="profileModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
      <div class="glass-card w-full max-w-sm rounded-3xl p-6 border border-slate-700 shadow-2xl relative space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
        <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition">
          <i class="ph-bold ph-x text-lg"></i>
        </button>

        <div class="text-center">
          <h3 class="text-xl font-extrabold text-white">Editar Perfil</h3>
          <p class="text-xs text-slate-400 mt-1">Atualize suas métricas e foto</p>
        </div>

        <form onsubmit="saveUserProfile(event)" class="space-y-4">
          <!-- Photo Selector -->
          <div class="flex flex-col items-center">
            <div class="relative group cursor-pointer" onclick="document.getElementById('photoInput').click()">
              <img id="profileModalImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-20 h-20 rounded-full object-cover border-2 border-brand-500 shadow-lg">
              <div class="absolute inset-0 bg-slate-950/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <i class="ph-bold ph-camera text-white text-xl"></i>
              </div>
            </div>
            <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
            <span class="text-[11px] text-slate-400 mt-1 cursor-pointer" onclick="document.getElementById('photoInput').click()">Toque para alterar a foto</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nome Completo</label>
            <input type="text" id="profName" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Idade</label>
              <input type="number" id="profAge" placeholder="25" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Altura (cm)</label>
              <input type="number" id="profHeight" placeholder="175" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Peso (kg)</label>
              <input type="number" step="0.1" id="profWeight" placeholder="70" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
            </div>
          </div>

          <button type="submit" id="saveProfileBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-brand-500/20 transition text-sm flex items-center justify-center space-x-2 mt-2">
            <i class="ph-bold ph-floppy-disk"></i>
            <span>Salvar Perfil</span>
          </button>
        </form>
      </div>
    </div>

    <!-- EXERCISE MODAL (ADD / EDIT) -->
    <div id="exerciseModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
      <div class="glass-card w-full max-w-sm rounded-3xl p-6 border border-slate-700 shadow-2xl relative space-y-4">
        <button onclick="closeExerciseModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition">
          <i class="ph-bold ph-x text-lg"></i>
        </button>

        <h3 id="exerciseModalTitle" class="text-xl font-extrabold text-white text-center">Novo Exercício</h3>

        <form onsubmit="saveExercise(event)" class="space-y-3">
          <input type="hidden" id="exIndex" value="-1">

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Exercício</label>
            <input type="text" id="exName" required placeholder="Ex: Supino Reto" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Séries</label>
              <input type="text" id="exSeries" placeholder="4" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Repetições</label>
              <input type="text" id="exReps" placeholder="10-12" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Carga (kg)</label>
            <input type="text" id="exWeight" placeholder="25kg cada lado" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Observação / Descanso</label>
            <input type="text" id="exObs" placeholder="Ex: Descanso 60s" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm focus:outline-none focus:border-brand-500">
          </div>

          <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-brand-500/20 transition text-sm flex items-center justify-center space-x-2 mt-2">
            <i class="ph-bold ph-check-circle"></i>
            <span>Salvar Exercício</span>
          </button>
        </form>
      </div>
    </div>

  </div>

  <!-- FIREBASE SDKS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
        apiKey: "AIzaSyDjamnwcgG61PrwP08uP8RRJ_x99zALZ8A",
        authDomain: "treinoacademia-13aff.firebaseapp.com",
        projectId: "treinoacademia-13aff",
        storageBucket: "treinoacademia-13aff.firebasestorage.app",
        messagingSenderId: "494669882064",
        appId: "1:494669882064:web:dcfb2bd3630b5d3d2874d5",
        measurementId: "G-6CR9J6DWZZ"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estados do App
    let currentUser = null;
    let isRegisterMode = false;
    let currentTab = 'A';
    
    let userProfile = {
      name: "",
      age: "",
      height: "",
      weight: "",
      photo: ""
    };

    let workouts = {
      A: [], B: [], C: [], D: [], E: [], F: [], G: []
    };

    const defaultAvatar = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80";

    // Observe Auth Changes
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        await loadUserData();
      } else {
        currentUser = null;
        document.getElementById('authScreen').classList.remove('hidden');
      }
    });

    // Toggle Auth Mode
    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      const subtitle = document.getElementById('authSubtitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('toggleAuthBtn');

      if (isRegisterMode) {
        subtitle.textContent = "Crie sua conta para salvar seus treinos";
        submitBtn.querySelector('span').textContent = "Cadastrar Conta";
        toggleBtn.textContent = "Já tem uma conta? Faça Login";
      } else {
        subtitle.textContent = "Acesse sua ficha de treinos personalizada";
        submitBtn.querySelector('span').textContent = "Entrar no App";
        toggleBtn.textContent = "Não tem uma conta? Cadastre-se";
      }
    };

    // Auth Handler
    window.handleAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('authSubmitBtn');

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("Erro na autenticação: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
      }
    };

    // Logout
    window.logout = async () => {
      if (confirm("Deseja realmente sair da sua conta?")) {
        await signOut(auth);
      }
    };

    // SANITIZAÇÃO ESTRITA DE DADOS
    function sanitizeProfile(prof) {
      return {
        name: String(prof?.name || ""),
        age: String(prof?.age || ""),
        height: String(prof?.height || ""),
        weight: String(prof?.weight || ""),
        photo: String(prof?.photo || "")
      };
    }

    function sanitizeWorkouts(w) {
      const keys = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
      const cleanW = {};
      
      keys.forEach(k => {
        const list = Array.isArray(w?.[k]) ? w[k] : [];
        cleanW[k] = list.map(item => ({
          name: String(item?.name || ""),
          series: String(item?.series || ""),
          reps: String(item?.reps || ""),
          weight: String(item?.weight || ""),
          obs: String(item?.obs || "")
        }));
      });

      return cleanW;
    }

    // Load User Data
    async function loadUserData() {
      if (!currentUser) return;

      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          userProfile = sanitizeProfile(data.profile);
          workouts = sanitizeWorkouts(data.workouts);
        } else {
          userProfile = sanitizeProfile({});
          workouts = sanitizeWorkouts({});
          await saveUserData();
        }

        updateProfileHeader();
        renderExercises();
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
      }
    }

    // Save Data to Firestore
    async function saveUserData() {
      if (!currentUser) return;

      const userDocRef = doc(db, "users", currentUser.uid);
      
      const cleanProfileData = sanitizeProfile(userProfile);
      const cleanWorkoutsData = sanitizeWorkouts(workouts);

      await setDoc(userDocRef, {
        profile: cleanProfileData,
        workouts: cleanWorkoutsData
      }, { merge: true });

      userProfile = cleanProfileData;
      workouts = cleanWorkoutsData;
    }

    // UI Updates
    function updateProfileHeader() {
      const nameHeader = document.getElementById('userNameHeader');
      const avatarHeader = document.getElementById('userAvatarHeader');
      const avatarModal = document.getElementById('profileModalImg');

      const displayName = userProfile.name.trim() !== "" ? userProfile.name : (currentUser.email ? currentUser.email.split('@')[0] : "Atleta");
      const displayPhoto = userProfile.photo.trim() !== "" ? userProfile.photo : defaultAvatar;

      nameHeader.textContent = displayName;
      avatarHeader.src = displayPhoto;
      avatarModal.src = displayPhoto;

      document.getElementById('profName').value = userProfile.name || "";
      document.getElementById('profAge').value = userProfile.age || "";
      document.getElementById('profHeight').value = userProfile.height || "";
      document.getElementById('profWeight').value = userProfile.weight || "";
    }

    // Tab Switch
    window.selectWorkoutTab = (tab) => {
      currentTab = tab;
      document.getElementById('currentWorkoutLabel').textContent = tab;

      document.querySelectorAll('.workout-tab').forEach(btn => {
        btn.className = "workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-slate-800/80 text-slate-400 hover:text-white";
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) {
        activeBtn.className = "workout-tab flex-1 min-w-[48px] py-2.5 rounded-xl font-bold text-xs transition duration-200 bg-brand-500 text-slate-950 shadow-lg shadow-brand-500/20";
      }

      renderExercises();
    };

    // Render Exercises
    function renderExercises() {
      const listContainer = document.getElementById('exerciseList');
      const currentList = workouts[currentTab] || [];

      if (currentList.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-12 px-4 glass-card rounded-2xl border border-slate-800">
            <i class="ph-bold ph-barbell text-4xl text-slate-600 mb-2"></i>
            <p class="text-slate-400 text-sm font-medium">Nenhum exercício no Treino ${currentTab}</p>
            <p class="text-xs text-slate-500 mt-1">Toque no botão "+ Add Exercício" para começar.</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = currentList.map((item, index) => `
        <div class="glass-card rounded-2xl p-4 border border-slate-800/80 hover:border-slate-700 transition flex items-center justify-between">
          <div class="space-y-1 flex-1 pr-3">
            <h4 class="font-bold text-white text-sm">${item.name}</h4>
            <div class="flex items-center space-x-3 text-xs text-slate-400">
              <span class="bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700/50 text-brand-300 font-semibold">${item.series} séries</span>
              <span class="bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700/50 text-slate-300">${item.reps} rep</span>
              ${item.weight ? `<span class="bg-brand-500/10 text-brand-400 border border-brand-500/20 px-2 py-0.5 rounded-md font-medium">${item.weight}</span>` : ''}
            </div>
            ${item.obs ? `<p class="text-[11px] text-slate-500 italic mt-1"><i class="ph-bold ph-info mr-1"></i>${item.obs}</p>` : ''}
          </div>

          <div class="flex items-center space-x-1">
            <button onclick="openExerciseModal(${index})" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
              <i class="ph-bold ph-pencil-simple text-sm"></i>
            </button>
            <button onclick="deleteExercise(${index})" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition">
              <i class="ph-bold ph-trash text-sm"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Profile Modal
    window.openProfileModal = () => {
      updateProfileHeader();
      document.getElementById('profileModal').classList.remove('hidden');
    };

    window.closeProfileModal = () => {
      document.getElementById('profileModal').classList.add('hidden');
    };

    // Save Profile Fix
    window.saveUserProfile = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveProfileBtn');
      const originalHtml = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = `<span>Salvando...</span>`;

      try {
        userProfile.name = document.getElementById('profName').value;
        userProfile.age = document.getElementById('profAge').value;
        userProfile.height = document.getElementById('profHeight').value;
        userProfile.weight = document.getElementById('profWeight').value;

        await saveUserData();
        updateProfileHeader();
        closeProfileModal();

        alert("Perfil atualizado com sucesso!");
      } catch (err) {
        console.error("Erro ao salvar perfil:", err);
        alert("Erro ao salvar perfil: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    };

    // Photo Upload Handler (Resized base64)
    window.handlePhotoUpload = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          userProfile.photo = compressedBase64;
          document.getElementById('profileModalImg').src = compressedBase64;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // Exercise Modal
    window.openExerciseModal = (index = -1) => {
      const modal = document.getElementById('exerciseModal');
      const title = document.getElementById('exerciseModalTitle');
      document.getElementById('exIndex').value = index;

      if (index >= 0) {
        title.textContent = "Editar Exercício";
        const item = workouts[currentTab][index];
        document.getElementById('exName').value = item.name || "";
        document.getElementById('exSeries').value = item.series || "";
        document.getElementById('exReps').value = item.reps || "";
        document.getElementById('exWeight').value = item.weight || "";
        document.getElementById('exObs').value = item.obs || "";
      } else {
        title.textContent = "Novo Exercício";
        document.getElementById('exName').value = "";
        document.getElementById('exSeries').value = "";
        document.getElementById('exReps').value = "";
        document.getElementById('exWeight').value = "";
        document.getElementById('exObs').value = "";
      }

      modal.classList.remove('hidden');
    };

    window.closeExerciseModal = () => {
      document.getElementById('exerciseModal').classList.add('hidden');
    };

    // Save Exercise
    window.saveExercise = async (e) => {
      e.preventDefault();
      const index = parseInt(document.getElementById('exIndex').value);

      const exerciseData = {
        name: document.getElementById('exName').value,
        series: document.getElementById('exSeries').value,
        reps: document.getElementById('exReps').value,
        weight: document.getElementById('exWeight').value,
        obs: document.getElementById('exObs').value
      };

      if (!workouts[currentTab]) workouts[currentTab] = [];

      if (index >= 0) {
        workouts[currentTab][index] = exerciseData;
      } else {
        workouts[currentTab].push(exerciseData);
      }

      try {
        await saveUserData();
        renderExercises();
        closeExerciseModal();
      } catch (err) {
        alert("Erro ao salvar exercício: " + err.message);
      }
    };

    // Delete Exercise
    window.deleteExercise = async (index) => {
      if (confirm("Deseja remover este exercício?")) {
        workouts[currentTab].splice(index, 1);
        try {
          await saveUserData();
          renderExercises();
        } catch (err) {
          alert("Erro ao excluir: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
