<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Treino Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Chart.js para Análises -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

<div id="app-container" class="max-w-md mx-auto w-full min-h-screen flex flex-col relative pb-24">
    <!-- LOGIN / CADASTRO -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-center px-6 py-12">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/10 text-brand-400 mb-4 border border-brand-500/20 shadow-lg">
                <i class="ph-bold ph-barbell text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Meu Treino Pro</h1>
            <p class="text-slate-400 text-sm mt-1" id="authSubtitle">Acesse sua ficha de treinos personalizada</p>
        </div>
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <input type="email" id="authEmail" required placeholder="E-mail" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3.5 px-4 text-white text-sm">
            <input type="password" id="authPassword" required minlength="6" placeholder="Senha" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3.5 px-4 text-white text-sm">
            <button type="submit" id="authSubmitBtn" class="w-full bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg">Entrar no App</button>
        </form>
        <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="mt-6 text-xs text-brand-400 font-medium text-center w-full">Cadastrar-se</button>
    </div>

    <!-- CABEÇALHO -->
    <header class="p-5 glass-card sticky top-0 z-30 border-b border-slate-800/80">
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="openProfileModal()">
                <img id="userAvatarHeader" src="" class="w-12 h-12 rounded-full object-cover border-2 border-brand-500 p-0.5 shadow-md">
                <div>
                    <span class="text-xs text-slate-400 block">Bem-vindo(a)</span>
                    <h2 id="userNameHeader" class="text-base font-bold text-white truncate max-w-[150px]">Atleta</h2>
                </div>
            </div>
            <button onclick="logout()" class="w-9 h-9 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="ph-bold ph-sign-out text-lg"></i></button>
        </div>
        <div id="workoutTabsHeader" class="flex space-x-2 overflow-x-auto custom-scrollbar pb-1">
            <button onclick="selectWorkoutTab('A')" id="tab-A" class="workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-brand-500 text-white">Treino A</button>
            <button onclick="selectWorkoutTab('B')" id="tab-B" class="workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-slate-800 text-slate-400">Treino B</button>
            <button onclick="selectWorkoutTab('C')" id="tab-C" class="workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-slate-800 text-slate-400">Treino C</button>
            <button onclick="selectWorkoutTab('D')" id="tab-D" class="workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-slate-800 text-slate-400">Treino D</button>
            <button onclick="selectWorkoutTab('E')" id="tab-E" class="workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-slate-800 text-slate-400">Treino E</button>
        </div>
    </header>

    <main class="p-5 flex-1 relative">
        <!-- EXECUÇÃO -->
        <section id="viewExecute" class="space-y-4">
            <div class="flex justify-between items-center"><h3 class="text-lg font-extrabold text-white">Treino <span class="currentWorkoutLabel text-brand-400">A</span></h3></div>
            <div id="executeExerciseList" class="space-y-3"></div>
            <button onclick="finishCurrentSession()" class="w-full bg-brand-500 text-white font-extrabold py-4 rounded-2xl shadow-lg mt-4 flex items-center justify-center space-x-2">
                <i class="ph-bold ph-check-circle text-xl"></i><span>Finalizar Treino</span>
            </button>
        </section>

        <!-- EDIÇÃO -->
        <section id="viewEdit" class="space-y-4 hidden">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-extrabold text-white">Editar Ficha <span class="currentWorkoutLabel text-brand-400">A</span></h3>
                <button onclick="openExerciseModal()" class="bg-brand-500/10 text-brand-400 border border-brand-500/30 px-3 py-2 rounded-xl text-xs font-bold">+ Add</button>
            </div>
            <div id="editExerciseList" class="space-y-3"></div>
        </section>

        <!-- DESEMPENHO E ANÁLISES -->
        <section id="viewPerformance" class="space-y-4 hidden">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-extrabold text-white">Desempenho</h3>
                <button id="btnOpenWeightForm" onclick="toggleWeightForm()" class="hidden bg-brand-500/10 text-brand-400 border border-brand-500/30 px-3 py-2 rounded-xl text-xs font-bold">+ Log Peso</button>
            </div>
            <div class="flex bg-slate-900/50 p-1 rounded-2xl border border-slate-800">
                <button onclick="switchPerfTab('workouts')" id="perfTabWorkouts" class="flex-1 py-2 rounded-xl text-xs font-bold bg-brand-500 text-white">Treinos</button>
                <button onclick="switchPerfTab('weights')" id="perfTabWeights" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-400">Pesos</button>
                <button onclick="switchPerfTab('charts')" id="perfTabCharts" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-400">Análises</button>
            </div>
            <div id="subviewWorkouts"><div id="workoutHistoryList" class="space-y-3"></div></div>
            <div id="subviewWeights" class="hidden space-y-4">
                <div id="weightLogForm" class="glass-card rounded-2xl p-4 border border-brand-500/30 hidden space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="weightDate" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2 px-3 text-xs text-white">
                        <input type="number" id="weightValue" step="0.1" placeholder="Peso (kg)" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2 px-3 text-xs text-white">
                    </div>
                    <button onclick="saveWeightEntry()" class="w-full bg-brand-500 text-white text-xs font-bold py-2 rounded-xl">Salvar</button>
                </div>
                <div id="weightHistoryList" class="space-y-3"></div>
            </div>
            <div id="subviewCharts" class="hidden space-y-4">
                <div class="glass-card rounded-2xl p-4 border border-slate-800"><h4 class="text-[10px] font-bold text-slate-500 uppercase mb-4">Evolução de Peso (kg)</h4><canvas id="weightChart"></canvas></div>
                <div class="glass-card rounded-2xl p-4 border border-slate-800"><h4 class="text-[10px] font-bold text-slate-500 uppercase mb-4">Treinos por Semana</h4><canvas id="workoutChart"></canvas></div>
            </div>
        </section>
    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 max-w-md mx-auto grid grid-cols-3 p-2 gap-1.5">
        <button id="navExecuteBtn" onclick="switchView('execute')" class="flex flex-col items-center justify-center py-2.5 rounded-xl text-brand-400 bg-brand-500/10 border border-brand-500/20 font-bold text-xs"><i class="ph-bold ph-play-circle text-lg"></i>Treinar</button>
        <button id="navEditBtn" onclick="switchView('edit')" class="flex flex-col items-center justify-center py-2.5 rounded-xl text-slate-400 font-bold text-xs"><i class="ph-bold ph-pencil-line text-lg"></i>Ficha</button>
        <button id="navPerformanceBtn" onclick="switchView('performance')" class="flex flex-col items-center justify-center py-2.5 rounded-xl text-slate-400 font-bold text-xs"><i class="ph-bold ph-chart-bar text-lg"></i>Desempenho</button>
    </nav>

    <!-- MODAL PERFIL -->
    <div id="profileModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative space-y-4">
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400"><i class="ph-bold ph-x text-lg"></i></button>
            <h3 class="text-xl font-extrabold text-white text-center">Meu Perfil</h3>
            <form onsubmit="saveUserProfile(event)" class="space-y-3">
                <div class="flex flex-col items-center">
                    <img id="profileModalImg" src="" class="w-20 h-20 rounded-full object-cover border-2 border-brand-500" onclick="document.getElementById('photoInput').click()">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                </div>
                <input type="text" id="profName" placeholder="Nome" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="profAge" placeholder="Idade" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                    <input type="number" id="profHeight" placeholder="Altura(cm)" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                    <input type="number" step="0.1" id="profWeight" placeholder="Peso(kg)" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                </div>
                <button type="submit" class="w-full bg-brand-500 text-white font-bold py-3 rounded-xl shadow-lg mt-2">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <!-- MODAL EXERCÍCIO -->
    <div id="exerciseModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative space-y-3 overflow-y-auto max-h-[90vh] custom-scrollbar">
            <button onclick="closeExerciseModal()" class="absolute top-4 right-4 text-slate-400"><i class="ph-bold ph-x text-lg"></i></button>
            <h3 id="exerciseModalTitle" class="text-xl font-extrabold text-white text-center">Novo Exercício</h3>
            <form onsubmit="saveExercise(event)" class="space-y-3">
                <input type="hidden" id="exIndex" value="-1">
                <select id="exPresetSelect" onchange="applyPresetExercise(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-brand-300 text-sm focus:outline-none"></select>
                <input type="text" id="exName" required placeholder="Nome do Exercício" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="exSeries" placeholder="Séries" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                    <input type="text" id="exReps" placeholder="Reps" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="exWeight" placeholder="Carga Base" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                    <select id="exRestTime" class="bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-brand-300 text-sm">
                        <option value="60">60s Descanso</option><option value="90">90s Descanso</option><option value="120">120s Descanso</option>
                    </select>
                </div>
                <input type="url" id="exLink" placeholder="Link Vídeo (YouTube)" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 px-3 text-white text-sm">
                <button type="submit" class="w-full bg-brand-500 text-white font-bold py-3 rounded-xl shadow-lg mt-2">Salvar na Ficha</button>
            </form>
        </div>
    </div>
</div>

        { group: "Pernas (Inferiores)", name: "Panturrilha em pé (Smith)", link: "" },
        { group: "Pernas (Inferiores)", name: "Panturrilha em pé (Step)", link: "" },
        { group: "Pernas (Inferiores)", name: "Panturrilha sentado", link: "" },
        { group: "Pernas (Inferiores)", name: "Panturrilha no Leg Press", link: "" },
        { group: "Pernas (Inferiores)", name: "Cadeira flexora", link: "" },
        { group: "Pernas (Inferiores)", name: "Levantamento Terra Romeno (Barra)", link: "" },
        { group: "Pernas (Inferiores)", name: "Levantamento Terra Romeno (Halteres)", link: "" },
        { group: "Pernas (Inferiores)", name: "Mesa flexora", link: "" },
        { group: "Pernas (Inferiores)", name: "Stiff (Barra)", link: "" },
        { group: "Pernas (Inferiores)", name: "Stiff (Halteres)", link: "" }
    ];

    // ESTADOS GLOBAIS [20, 21]
    let currentUser = null;
    let isRegisterMode = false;
    let currentTab = 'A';
    let currentView = 'execute';
    let userProfile = { name: "", age: "", height: "", weight: "", photo: "" };
    let workouts = { A: [], B: [], C: [], D: [], E: [] };
    let history = [];
    let weightHistory = [];
    let currentSessionLogs = {};
    let weightChartInstance = null;
    let workoutChartInstance = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authScreen').classList.add('hidden');
            populatePresetsDropdown();
            await loadUserData();
        } else {
            currentUser = null;
            document.getElementById('authScreen').classList.remove('hidden');
        }
    });

    // POVOAR DROPDOWN AGRUPADO [22-24]
    function populatePresetsDropdown() {
        const select = document.getElementById('exPresetSelect');
        const groups = {};
        presetExercisesList.forEach((ex, idx) => {
            if (!groups[ex.group]) groups[ex.group] = [];
            groups[ex.group].push({ ...ex, idx });
        });
        let html = '<option value="">-- Sugestões por Músculo --</option>';
        for (const g in groups) {
            html += `<optgroup label="${g}" class="bg-slate-800 text-brand-400 font-bold">`;
            groups[g].forEach(ex => html += `<option value="${ex.idx}" class="bg-slate-900 text-white font-normal">${ex.name}</option>`);
            html += `</optgroup>`;
        }
        select.innerHTML = html;
    }

    window.applyPresetExercise = (i) => {
        if (i === "") return;
        const ex = presetExercisesList[parseInt(i)];
        if (ex) { document.getElementById('exName').value = ex.name; document.getElementById('exLink').value = ex.link; }
    };

    // AUTH LOGIC [25-28]
    window.handleAuth = async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        try {
            if (isRegisterMode) await createUserWithEmailAndPassword(auth, email, password);
            else await signInWithEmailAndPassword(auth, email, password);
        } catch (error) { alert("Erro: " + error.message); }
    };

    window.toggleAuthMode = () => {
        isRegisterMode = !isRegisterMode;
        document.getElementById('authSubtitle').textContent = isRegisterMode ? "Crie sua conta gratuita" : "Acesse sua ficha personalizada";
        document.getElementById('authSubmitBtn').textContent = isRegisterMode ? "Cadastrar" : "Entrar no App";
        document.getElementById('toggleAuthBtn').textContent = isRegisterMode ? "Já tenho conta" : "Cadastrar-se";
    };

    window.logout = () => { if(confirm("Deseja sair?")) signOut(auth); };

    // DATA SYNC [29-32]
    async function loadUserData() {
        const snap = await getDoc(doc(db, "users", currentUser.uid));
        if (snap.exists()) {
            const d = snap.data();
            userProfile = d.profile || userProfile;
            workouts = d.workouts || workouts;
            history = Array.isArray(d.history) ? d.history : [];
            weightHistory = Array.isArray(d.weightHistory) ? d.weightHistory : [];
        }
        updateProfileHeader();
        renderExercises();
    }

    async function saveUserData() {
        await setDoc(doc(db, "users", currentUser.uid), { profile: userProfile, workouts, history, weightHistory }, { merge: true });
    }

    // NAVEGAÇÃO [32-38]
    window.switchView = (view) => {
        currentView = view;
        ['viewExecute', 'viewEdit', 'viewPerformance'].forEach(v => document.getElementById(v).classList.add('hidden'));
        ['navExecuteBtn', 'navEditBtn', 'navPerformanceBtn'].forEach(b => document.getElementById(b).className = "flex flex-col items-center justify-center py-2.5 rounded-xl text-slate-400 font-bold text-xs");
        
        document.getElementById(`view${view.charAt(0).toUpperCase() + view.slice(1)}`).classList.remove('hidden');
        document.getElementById(`nav${view.charAt(0).toUpperCase() + view.slice(1)}Btn`).className = "flex flex-col items-center justify-center py-2.5 rounded-xl text-brand-400 bg-brand-500/10 border border-brand-500/20 font-bold text-xs";
        
        if (view === 'performance') renderPerformanceHistory();
        renderExercises();
    };

    window.selectWorkoutTab = (tab) => {
        currentTab = tab;
        document.querySelectorAll('.currentWorkoutLabel').forEach(el => el.textContent = tab);
        document.querySelectorAll('.workout-tab').forEach(b => b.className = "workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs bg-slate-800 text-slate-400");
        document.getElementById(`tab-${tab}`).className = "workout-tab flex-1 py-2.5 rounded-xl font-bold text-xs bg-brand-500 text-white shadow-lg";
        renderExercises();
    };

    // RENDERIZAÇÃO DE EXERCÍCIOS [38-52]
    function renderExercises() {
        const container = currentView === 'execute' ? document.getElementById('executeExerciseList') : document.getElementById('editExerciseList');
        const list = workouts[currentTab] || [];
        if (list.length === 0) { container.innerHTML = `<div class="text-center py-10 text-slate-500 italic">Treino ${currentTab} vazio.</div>`; return; }
        
        container.innerHTML = list.map((item, i) => {
            if (currentView === 'execute') {
                if (!currentSessionLogs[i]) currentSessionLogs[i] = { seriesDone: new Array(parseInt(item.series)||3).fill(false), weight: item.weight || '', reps: item.reps || '' };
                const log = currentSessionLogs[i];
                return `
                    <div class="glass-card rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between font-bold"><span>${item.name}</span><span class="text-brand-300">${item.series}x</span></div>
                        <div class="flex flex-wrap gap-2">${log.seriesDone.map((d, sIdx) => `
                            <button onclick="toggleSerieDone(${i}, ${sIdx})" class="px-3 py-1.5 rounded-xl border ${d ? 'bg-brand-500 border-brand-500 text-white' : 'border-slate-800 text-slate-500'} text-[10px] font-bold">S${sIdx+1}</button>`).join('')}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input onchange="currentSessionLogs[${i}].reps=this.value" value="${log.reps}" placeholder="Reps" class="bg-slate-900 border border-slate-800 rounded-xl py-1.5 px-3 text-xs">
                            <input onchange="currentSessionLogs[${i}].weight=this.value" value="${log.weight}" placeholder="Carga" class="bg-slate-900 border border-slate-800 rounded-xl py-1.5 px-3 text-xs text-brand-400 font-bold">
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="glass-card rounded-2xl p-4 flex justify-between items-center">
                        <div><h4 class="font-bold text-sm text-white">${item.name}</h4><p class="text-xs text-slate-500">${item.series}x • ${item.reps} • ${item.weight}</p></div>
                        <div class="flex gap-2">
                            <button onclick="openExerciseModal(${i})" class="text-slate-400 p-2"><i class="ph-bold ph-pencil-simple"></i></button>
                            <button onclick="deleteExercise(${i})" class="text-red-400 p-2"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>`;
            }
        }).join('');
    }

    window.toggleSerieDone = (exI, sI) => { currentSessionLogs[exI].seriesDone[sI] = !currentSessionLogs[exI].seriesDone[sI]; renderExercises(); };

    window.finishCurrentSession = async () => {
        const now = new Date();
        const entry = {
            id: Date.now(),
            dateFormatted: now.toLocaleString('pt-BR'),
            dateIso: now.toISOString(),
            workoutTab: currentTab,
            exercises: (workouts[currentTab]||[]).map((ex, i) => ({
                name: ex.name,
                seriesTotal: ex.series,
                seriesCompleted: currentSessionLogs[i].seriesDone.filter(Boolean).length,
                weightUsed: currentSessionLogs[i].weight || ex.weight
            }))
        };
        history.unshift(entry);
        await saveUserData();
        alert("Treino finalizado e salvo!");
        currentSessionLogs = {};
        renderExercises();
    };

    // PERFORMANCE E ANÁLISES (SUBTELAS) [2, 53-61]
    window.switchPerfTab = (tab) => {
        ['subviewWorkouts', 'subviewWeights', 'subviewCharts'].forEach(v => document.getElementById(v).classList.add('hidden'));
        ['perfTabWorkouts', 'perfTabWeights', 'perfTabCharts'].forEach(t => document.getElementById(t).className = "flex-1 py-2 rounded-xl text-xs font-bold text-slate-400");
        
        document.getElementById(`subview${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
        document.getElementById(`perfTab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).className = "flex-1 py-2 rounded-xl text-xs font-bold bg-brand-500 text-white shadow-lg";
        document.getElementById('btnOpenWeightForm').classList.toggle('hidden', tab !== 'weights');
        
        if (tab === 'charts') renderCharts();
        renderPerformanceHistory();
    };

    function renderPerformanceHistory() {
        const wCont = document.getElementById('weightHistoryList');
        const hCont = document.getElementById('workoutHistoryList');

        wCont.innerHTML = weightHistory.length === 0 ? `<p class="text-center py-4 text-xs italic">Sem registros.</p>` : 
            weightHistory.map(w => {
                const [y, m, d] = w.date.split('-');
                const h = parseFloat(userProfile.height);
                const imc = (!h || h <= 0) ? "0.0" : (parseFloat(w.weight) / ((h/100)**2)).toFixed(1);
                return `<div class="glass-card rounded-2xl p-4 flex justify-between items-center border border-brand-500/20">
                    <div><p class="text-xs text-slate-400">Peso <span class="text-brand-400 text-[10px] font-bold">• IMC: ${imc}</span></p><p class="font-bold text-white">${w.weight} kg</p></div>
                    <div class="flex items-center gap-3"><span class="text-[10px] text-slate-500">${d}/${m}/${y}</span><button onclick="deleteWeightEntry(${w.id})" class="text-red-400/60"><i class="ph-bold ph-trash"></i></button></div>
                </div>`;
            }).join('');

        hCont.innerHTML = history.length === 0 ? `<p class="text-center py-4 text-xs italic">Sem treinos salvos.</p>` :
            history.map((h, i) => `<div class="glass-card rounded-2xl p-4 space-y-2">
                <div class="flex justify-between items-center"><div class="flex gap-2 items-center"><div class="bg-brand-500 w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs">${h.workoutTab}</div><div><h4 class="text-sm font-bold">Finalizado</h4><p class="text-[10px] text-slate-500">${h.dateFormatted}</p></div></div><button onclick="deleteHistorySession(${i})" class="text-red-400/60"><i class="ph-bold ph-trash"></i></button></div>
                <div class="bg-slate-900/50 rounded-xl p-2">${h.exercises.map(ex => `<div class="flex justify-between text-[10px] py-1 border-b border-white/5"><span class="text-slate-300">${ex.name}</span><span class="text-brand-400 font-bold">${ex.seriesCompleted}/${ex.seriesTotal} séri. • ${ex.weightUsed}</span></div>`).join('')}</div>
            </div>`).join('');
    }

    // GRÁFICOS (CHART.JS)
    function renderCharts() {
        if (weightChartInstance) weightChartInstance.destroy();
        if (workoutChartInstance) workoutChartInstance.destroy();

        const sortedW = [...weightHistory].sort((a,b) => new Date(a.date) - new Date(b.date));
        weightChartInstance = new Chart(document.getElementById('weightChart'), {
            type: 'line',
            data: {
                labels: sortedW.map(w => { const [y,m,d] = w.date.split('-'); return `${d}/${m}`; }),
                datasets: [{ label: 'Peso', data: sortedW.map(w => w.weight), borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
        });

        const last4Weeks = [];
        for (let i = 3; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - (i*7));
            const sun = new Date(d); sun.setDate(d.getDate() - d.getDay()); sun.setHours(0,0,0,0);
            const sat = new Date(d); sat.setDate(d.getDate() + (6 - d.getDay())); sat.setHours(23,59,59,999);
            const count = history.filter(h => { const hd = new Date(h.dateIso); return hd >= sun && hd <= sat; }).length;
            last4Weeks.push({ label: `${sun.getDate()}/${sun.getMonth()+1}-${sat.getDate()}/${sat.getMonth()+1}`, count });
        }
        workoutChartInstance = new Chart(document.getElementById('workoutChart'), {
            type: 'bar',
            data: { labels: last4Weeks.map(w=>w.label), datasets: [{ data: last4Weeks.map(w=>w.count), backgroundColor: '#60a5fa', borderRadius: 4 }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });
    }

    // PESO ENTRY [62-64]
    window.toggleWeightForm = () => { const f = document.getElementById('weightLogForm'); f.classList.toggle('hidden'); if(!f.classList.contains('hidden')) document.getElementById('weightDate').value = new Date().toISOString().split('T'); };
    window.saveWeightEntry = async () => {
        const d = document.getElementById('weightDate').value, w = document.getElementById('weightValue').value;
        if (!d || !w) return alert("Preencha data e peso!");
        weightHistory.unshift({ id: Date.now(), date: d, weight: w });
        weightHistory.sort((a,b) => new Date(b.date) - new Date(a.date));
        await saveUserData();
        document.getElementById('weightLogForm').classList.add('hidden');
        renderPerformanceHistory();
    };
    window.deleteWeightEntry = async (id) => { if(confirm("Apagar peso?")) { weightHistory = weightHistory.filter(w => w.id !== id); await saveUserData(); renderPerformanceHistory(); }};
    window.deleteHistorySession = async (i) => { if(confirm("Apagar treino?")) { history.splice(i, 1); await saveUserData(); renderPerformanceHistory(); }};

    // PERFIL [64-68]
    function updateProfileHeader() {
        document.getElementById('userNameHeader').textContent = userProfile.name || "Atleta";
        document.getElementById('userAvatarHeader').src = userProfile.photo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100";
        document.getElementById('profileModalImg').src = userProfile.photo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100";
        document.getElementById('profName').value = userProfile.name;
        document.getElementById('profAge').value = userProfile.age;
        document.getElementById('profHeight').value = userProfile.height;
        document.getElementById('profWeight').value = userProfile.weight;
    }

    window.saveUserProfile = async (e) => {
        e.preventDefault();
        userProfile.name = document.getElementById('profName').value;
        userProfile.age = document.getElementById('profAge').value;
        userProfile.height = document.getElementById('profHeight').value;
        userProfile.weight = document.getElementById('profWeight').value;
        await saveUserData(); updateProfileHeader(); closeProfileModal();
    };

    window.handlePhotoUpload = (e) => {
        const file = e.target.files; if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                canvas.width = 150; canvas.height = 150;
                ctx.drawImage(img, 0, 0, 150, 150);
                userProfile.photo = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('profileModalImg').src = userProfile.photo;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    // CRUD EXERCÍCIOS [68-74]
    window.saveExercise = async (e) => {
        e.preventDefault();
        const idx = parseInt(document.getElementById('exIndex').value);
        const data = {
            name: document.getElementById('exName').value,
            series: document.getElementById('exSeries').value || "3",
            reps: document.getElementById('exReps').value,
            weight: document.getElementById('exWeight').value,
            restTime: document.getElementById('exRestTime').value,
            link: document.getElementById('exLink').value
        };
        if (idx >= 0) workouts[currentTab][idx] = data; else workouts[currentTab].push(data);
        await saveUserData(); renderExercises(); closeExerciseModal();
    };

    window.deleteExercise = async (i) => { if(confirm("Remover exercício?")) { workouts[currentTab].splice(i, 1); await saveUserData(); renderExercises(); }};
    window.openProfileModal = () => document.getElementById('profileModal').classList.remove('hidden');
    window.closeProfileModal = () => document.getElementById('profileModal').classList.add('hidden');
    window.openExerciseModal = (idx = -1) => {
        document.getElementById('exIndex').value = idx;
        if(idx >= 0) {
            const e = workouts[currentTab][idx];
            document.getElementById('exName').value = e.name;
            document.getElementById('exSeries').value = e.series;
            document.getElementById('exReps').value = e.reps;
            document.getElementById('exWeight').value = e.weight;
            document.getElementById('exLink').value = e.link;
        } else {
            document.getElementById('exName').value = ""; document.getElementById('exSeries').value = "3";
        }
        document.getElementById('exerciseModal').classList.remove('hidden');
    };
    window.closeExerciseModal = () => document.getElementById('exerciseModal').classList.add('hidden');
</script>
</body>
</html>
