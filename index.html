<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Treino Pro</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --border: #333333;
      --video-btn: #ff3d00;
      --active-mode: #29b6f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 100px;
    }

    /* Tela de Login */
    #authContainer {
      max-width: 400px;
      margin: 40px auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .auth-title { text-align: center; color: var(--accent); margin-bottom: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .btn-auth { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    .auth-toggle { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--subtext); }
    .auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }

    /* App Principal */
    #appContainer { display: none; }

    #timerBanner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #00c853;
      color: #000;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      font-size: 1.2rem;
      z-index: 1000;
    }

    /* Barra Superior do Perfil */
    .user-profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--accent);
    }

    .user-details strong { display: block; font-size: 0.95rem; }
    .user-details span { font-size: 0.75rem; color: var(--subtext); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: #ff5252;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
    h1 { font-size: 1.3rem; margin: 0; color: var(--accent); }

    .controls-row { display: flex; gap: 8px; margin-bottom: 16px; }

    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-mode { flex: 1; font-weight: bold; background: #2a2a2a; cursor: pointer; }
    .btn-mode.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .exercise-card {
      background-color: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .exercise-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .exercise-title { font-size: 1.1rem; font-weight: bold; width: 100%; background: transparent; border: none; color: var(--text); border-bottom: 1px dashed var(--border); padding-bottom: 4px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .field-group { display: flex; flex-direction: column; }
    label { font-size: 0.75rem; color: var(--subtext); margin-bottom: 4px; text-transform: uppercase; }

    input { background: #2a2a2a; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 0.95rem; outline: none; }

    .btn-video { display: inline-flex; align-items: center; background-color: var(--video-btn); color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .checklist { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .check-btn { flex: 1; min-width: 60px; padding: 10px; background: #2a2a2a; border: 1px solid var(--border); color: var(--text); border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; }
    .check-btn.done { background: var(--accent); color: #000; }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; padding: 20px; overflow-y: auto; }
    .modal-content { background: var(--card); border-radius: 12px; padding: 16px; max-width: 500px; margin: 40px auto; }
    .db-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

    .timer-btn-group { display: flex; gap: 6px; margin-top: 6px; }
    .timer-btn { background: #333; border: none; color: #fff; padding: 6px; border-radius: 4px; font-size: 0.75rem; flex: 1; cursor: pointer; }
    .history-tag { font-size: 0.75rem; color: var(--active-mode); margin-top: 4px; }

    .btn-add { position: fixed; bottom: 20px; right: 20px; background-color: var(--accent); color: #000; border: none; border-radius: 50px; padding: 14px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-delete { background: transparent; color: #ff5252; border: none; font-size: 1.2rem; cursor: pointer; }
    
    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      background: #333;
    }
  </style>
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="authContainer">
    <h2 class="auth-title" id="authTitle">🏋️ Login do Atleta</h2>
    <form class="auth-form" onsubmit="handleAuth(event)">
      <div class="field-group">
        <label>E-mail</label>
        <input type="email" id="authEmail" required placeholder="seu@email.com">
      </div>
      <div class="field-group">
        <label>Senha</label>
        <input type="password" id="authPassword" required placeholder="******">
      </div>
      <button type="submit" class="btn-auth" id="btnAuthSubmit">Entrar</button>
    </form>
    <div class="auth-toggle">
      <span id="authToggleText" onclick="toggleAuthMode()">Não tem conta? Cadastre-se</span>
    </div>
  </div>

  <!-- APLICATIVO PRINCIPAL -->
  <div id="appContainer">
    <div id="timerBanner">⏱️ Descanso: <span id="timerClock">00:00</span></div>

    <!-- Barra de Perfil -->
    <div class="user-profile-header">
      <div class="profile-info" onclick="openProfileModal()">
        <img id="headerAvatar" class="avatar" src="" alt="Foto" style="display:none;">
        <div id="headerAvatarPlaceholder" class="avatar">?</div>
        <div class="user-details">
          <strong id="headerUserName">Atleta</strong>
          <span id="headerUserMetrics">Toque para editar perfil</span>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>

    <header>
      <h1>🏋️ Meu Treino</h1>
      <select id="selectWorkout" onchange="changeWorkout()">
        <option value="A">Treino A</option>
        <option value="B">Treino B</option>
        <option value="C">Treino C</option>
        <option value="D">Treino D</option>
        <option value="E">Treino E</option>
        <option value="F">Treino F</option>
        <option value="G">Treino G</option>
      </select>
    </header>

    <div class="controls-row">
      <button id="btnModeEdit" class="btn-mode active" onclick="setMode('edit')">✏️ Montar</button>
      <button id="btnModeActive" class="btn-mode" onclick="setMode('active')">🔥 Treinar</button>
    </div>

    <div id="exerciseList"></div>

    <button class="btn-add" id="btnAddEx" onclick="openDatabase()">+ Adicionar Exercício</button>

    <!-- Modal do Banco de Dados de Exercícios -->
    <div id="dbModal" class="modal">
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3>Biblioteca de Exercícios</h3>
          <button onclick="closeDatabase()" style="background:none; border:none; color:#fff; font-size:1.5rem;">✕</button>
        </div>
        <select id="dbGroupFilter" onchange="renderDatabase()" style="width: 100%; margin-bottom: 12px;">
          <option value="Todos">Todos os Grupos</option>
          <option value="Peito">Peito</option>
          <option value="Costas">Costas</option>
          <option value="Pernas">Pernas</option>
          <option value="Ombros">Ombros</option>
          <option value="Bíceps">Bíceps</option>
          <option value="Tríceps">Tríceps</option>
          <option value="Abdômen">Abdômen</option>
        </select>
        <div id="dbList"></div>
      </div>
    </div>

    <!-- Modal Editar Perfil -->
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3>Perfil do Atleta</h3>
          <button onclick="closeProfileModal()" style="background:none; border:none; color:#fff; font-size:1.5rem;">✕</button>
        </div>
        
        <div class="avatar-upload">
          <img id="modalAvatarPreview" class="avatar-large" src="" style="display:none;">
          <div id="modalAvatarPlaceholder" class="avatar-large" style="display:flex; align-items:center; justify-content:center; font-size:2rem; color:var(--accent);">?</div>
          <input type="file" id="inputPhoto" accept="image/*" onchange="handlePhotoUpload(event)" style="font-size:0.8rem; width:100%;">
        </div>

        <form class="auth-form" onsubmit="saveUserProfile(event)">
          <div class="field-group">
            <label>Nome Completo</label>
            <input type="text" id="profName" placeholder="Ex: Alexandre Merello">
          </div>
          <div class="grid-2">
            <div class="field-group">
              <label>Idade</label>
              <input type="number" id="profAge" placeholder="Ex: 30">
            </div>
            <div class="field-group">
              <label>Altura (cm)</label>
              <input type="number" id="profHeight" placeholder="Ex: 175">
            </div>
          </div>
          <div class="field-group">
            <label>Peso (kg)</label>
            <input type="number" step="0.1" id="profWeight" placeholder="Ex: 75.5">
          </div>
          <button type="submit" class="btn-auth">Salvar Perfil</button>
        </form>
      </div>
    </div>

  </div>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⬇️ COLE AQUI SUA CONFIGURAÇÃO DO FIREBASE (COM A SUA APIKEY REAL)
      const firebaseConfig = {
        apiKey: "AIzaSyDjamnwcgG61PrwP08uP8RRJ_x99zALZ8A",
        authDomain: "treinoacademia-13aff.firebaseapp.com",
        projectId: "treinoacademia-13aff",
        storageBucket: "treinoacademia-13aff.firebasestorage.app",
        messagingSenderId: "494669882064",
        appId: "1:494669882064:web:dcfb2bd3630b5d3d2874d5",
        measurementId: "G-6CR9J6DWZZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const exerciseDB = [
      { group: 'Peito', name: 'Supino Reto com Barra' },
      { group: 'Peito', name: 'Supino Inclinado com Halteres' },
      { group: 'Peito', name: 'Crossover na Polia Alta' },
      { group: 'Peito', name: 'Peck Deck / Voador' },
      { group: 'Costas', name: 'Puxada Frontal na Polia' },
      { group: 'Costas', name: 'Remada Curvada com Barra' },
      { group: 'Costas', name: 'Remada Baixa Triângulo' },
      { group: 'Pernas', name: 'Agachamento Livre com Barra' },
      { group: 'Pernas', name: 'Leg Press 45°' },
      { group: 'Pernas', name: 'Cadeira Extensora' },
      { group: 'Pernas', name: 'Mesa Flexora' },
      { group: 'Ombros', name: 'Desenvolvimento com Halteres' },
      { group: 'Ombros', name: 'Elevação Lateral' },
      { group: 'Bíceps', name: 'Rosca Direta com Barra' },
      { group: 'Bíceps', name: 'Rosca Alternada com Halteres' },
      { group: 'Tríceps', name: 'Tríceps Pulley / Corda' },
      { group: 'Tríceps', name: 'Tríceps Testa' }
    ];

    let currentUser = null;
    let currentWorkout = 'A';
    let appMode = 'edit';
    let timerInterval = null;
    let isSignUp = false;

    let userProfile = { name: '', age: '', height: '', weight: '', photo: '' };
    let workouts = { A: [], B: [], C: [], D: [], E: [], F: [], G: [] };

    // AUTENTICAÇÃO E SESSÃO
    window.toggleAuthMode = () => {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').textContent = isSignUp ? '📝 Novo Cadastro' : '🏋️ Login do Atleta';
      document.getElementById('btnAuthSubmit').textContent = isSignUp ? 'Cadastrar' : 'Entrar';
      document.getElementById('authToggleText').innerHTML = isSignUp ? 'Já tem conta? <span>Faça Login</span>' : 'Não tem conta? <span>Cadastre-se</span>';
    };

    window.handleAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        alert("Erro na autenticação: " + err.message);
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        await loadUserData();
      } else {
        currentUser = null;
        document.getElementById('authContainer').style.display = 'block';
        document.getElementById('appContainer').style.display = 'none';
      }
    });

    // CARREGAR E SALVAR DADOS NO FIRESTORE
    async function loadUserData() {
      if (!currentUser) return;
      const userDocRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(userDocRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        workouts = data.workouts || workouts;
        userProfile = data.profile || userProfile;
      } else {
        workouts = { A: [], B: [], C: [], D: [], E: [], F: [], G: [] };
        userProfile = { name: '', age: '', height: '', weight: '', photo: '' };
        await setDoc(userDocRef, { workouts, profile: userProfile });
      }
      updateProfileHeader();
      render();
    }

    async function saveUserData() {
      if (!currentUser) return;
      const userDocRef = doc(db, "users", currentUser.uid);
      await setDoc(userDocRef, { workouts, profile: userProfile }, { merge: true });
    }

    // GESTÃO DE PERFIL
    window.openProfileModal = () => {
      document.getElementById('profName').value = userProfile.name || '';
      document.getElementById('profAge').value = userProfile.age || '';
      document.getElementById('profHeight').value = userProfile.height || '';
      document.getElementById('profWeight').value = userProfile.weight || '';

      const modalImg = document.getElementById('modalAvatarPreview');
      const modalPlaceholder = document.getElementById('modalAvatarPlaceholder');

      if (userProfile.photo) {
        modalImg.src = userProfile.photo;
        modalImg.style.display = 'block';
        modalPlaceholder.style.display = 'none';
      } else {
        modalImg.style.display = 'none';
        modalPlaceholder.style.display = 'flex';
      }

      document.getElementById('profileModal').style.display = 'block';
    };

    window.closeProfileModal = () => document.getElementById('profileModal').style.display = 'none';

    window.handlePhotoUpload = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          userProfile.photo = event.target.result; // Converte imagem em string Base64
          document.getElementById('modalAvatarPreview').src = userProfile.photo;
          document.getElementById('modalAvatarPreview').style.display = 'block';
          document.getElementById('modalAvatarPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    };

    window.saveUserProfile = async (e) => {
      e.preventDefault();
      userProfile.name = document.getElementById('profName').value;
      userProfile.age = document.getElementById('profAge').value;
      userProfile.height = document.getElementById('profHeight').value;
      userProfile.weight = document.getElementById('profWeight').value;

      await saveUserData();
      updateProfileHeader();
      closeProfileModal();
    };

    function updateProfileHeader() {
      const headerImg = document.getElementById('headerAvatar');
      const headerPlaceholder = document.getElementById('headerAvatarPlaceholder');

      document.getElementById('headerUserName').textContent = userProfile.name || currentUser.email.split('@')[0];
      
      let metrics = [];
      if (userProfile.weight) metrics.push(`${userProfile.weight}kg`);
      if (userProfile.height) metrics.push(`${userProfile.height}cm`);
      if (userProfile.age) metrics.push(`${userProfile.age} anos`);
      
      document.getElementById('headerUserMetrics').textContent = metrics.length ? metrics.join(' • ') : 'Toque para editar perfil';

      if (userProfile.photo) {
        headerImg.src = userProfile.photo;
        headerImg.style.display = 'block';
        headerPlaceholder.style.display = 'none';
      } else {
        headerImg.style.display = 'none';
        headerPlaceholder.style.display = 'flex';
        headerPlaceholder.textContent = (userProfile.name || 'A').charAt(0).toUpperCase();
      }
    }

    // LÓGICA DE TREINOS
    window.setMode = (mode) => {
      appMode = mode;
      document.getElementById('btnModeEdit').classList.toggle('active', mode === 'edit');
      document.getElementById('btnModeActive').classList.toggle('active', mode === 'active');
      document.getElementById('btnAddEx').style.display = mode === 'edit' ? 'block' : 'none';
      render();
    };

    function render() {
      const list = document.getElementById('exerciseList');
      list.innerHTML = '';
      const currentList = workouts[currentWorkout] || [];

      currentList.forEach((ex, index) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        const videoBtn = ex.video ? `<a href="${ex.video}" target="_blank" class="btn-video">▶ Vídeo</a>` : '';
        const historyText = ex.lastWeight ? `<div class="history-tag">📈 Carga anterior: ${ex.lastWeight} (${ex.lastDate || 'Recente'})</div>` : '';

        if (appMode === 'edit') {
          card.innerHTML = `
            <div class="exercise-header">
              <input type="text" class="exercise-title" value="${ex.name}" placeholder="Nome do Exercício" onchange="updateEx(${index}, 'name', this.value)">
              ${videoBtn}
              <button class="btn-delete" onclick="removeEx(${index})">✕</button>
            </div>
            <div class="grid-2">
              <div class="field-group">
                <label>Carga Atual</label>
                <input type="text" value="${ex.weight || ''}" placeholder="Ex: 20kg" onchange="updateWeight(${index}, this.value)">
                ${historyText}
              </div>
              <div class="field-group">
                <label>Repetições</label>
                <input type="text" value="${ex.reps || ''}" placeholder="Ex: 3x10" onchange="updateEx(${index}, 'reps', this.value)">
              </div>
            </div>
            <div class="grid-2">
              <div class="field-group">
                <label>Ritmo</label>
                <input type="text" value="${ex.tempo || ''}" placeholder="Ex: 2010" onchange="updateEx(${index}, 'tempo', this.value)">
              </div>
              <div class="field-group">
                <label>Descanso Ideal</label>
                <input type="text" value="${ex.rest || ''}" placeholder="Ex: 60s" onchange="updateEx(${index}, 'rest', this.value)">
              </div>
            </div>
            <div class="field-group" style="margin-top:8px;">
              <label>Link do Vídeo (URL)</label>
              <input type="url" value="${ex.video || ''}" placeholder="https://youtube.com/..." onchange="updateVideoUrl(${index}, this.value)">
            </div>
            <div class="field-group" style="margin-top:8px;">
              <label>Observações</label>
              <input type="text" value="${ex.obs || ''}" placeholder="Ex: Banco no nível 3" onchange="updateEx(${index}, 'obs', this.value)">
            </div>
          `;
        } else {
          let setsHtml = '';
          const totalSets = parseInt(ex.reps) || 3;
          ex.completedSets = ex.completedSets || [];

          for (let i = 0; i < totalSets; i++) {
            const isDone = ex.completedSets[i] ? 'done' : '';
            setsHtml += `<div class="check-btn ${isDone}" onclick="toggleSet(${index}, ${i})">Série ${i + 1}</div>`;
          }

          card.innerHTML = `
            <div class="exercise-header">
              <strong style="font-size:1.1rem;">${ex.name}</strong>
              ${videoBtn}
            </div>
            <div style="font-size:0.9rem; color:var(--subtext); margin-bottom:8px;">
              <strong>Carga:</strong> ${ex.weight || 'Sem carga'} | <strong>Reps:</strong> ${ex.reps || '-'} | <strong>Ritmo:</strong> ${ex.tempo || '-'}
            </div>
            ${ex.obs ? `<div style="font-size:0.85rem; color:#ffd54f; margin-bottom:8px;">📌 ${ex.obs}</div>` : ''}
            
            <label>Marcar Séries Concluídas:</label>
            <div class="checklist">${setsHtml}</div>

            <div style="margin-top:12px;">
              <label>Iniciar Descanso Cronometrado:</label>
              <div class="timer-btn-group">
                <button class="timer-btn" onclick="startTimer(30)">30s</button>
                <button class="timer-btn" onclick="startTimer(60)">60s</button>
                <button class="timer-btn" onclick="startTimer(90)">90s</button>
                <button class="timer-btn" onclick="startTimer(120)">120s</button>
              </div>
            </div>
          `;
        }
        list.appendChild(card);
      });
    }

    window.updateEx = (index, field, value) => {
      workouts[currentWorkout][index][field] = value;
      saveUserData();
    };

    window.updateWeight = (index, newWeight) => {
      const ex = workouts[currentWorkout][index];
      if (ex.weight && ex.weight !== newWeight) {
        ex.lastWeight = ex.weight;
        ex.lastDate = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      }
      ex.weight = newWeight;
      saveUserData();
      render();
    };

    window.updateVideoUrl = (index, newUrl) => {
      workouts[currentWorkout][index].video = newUrl;
      saveUserData();
      render();
    };

    window.toggleSet = (exIndex, setIndex) => {
      const ex = workouts[currentWorkout][exIndex];
      ex.completedSets = ex.completedSets || [];
      ex.completedSets[setIndex] = !ex.completedSets[setIndex];
      saveUserData();
      render();
    };

    window.changeWorkout = () => {
      currentWorkout = document.getElementById('selectWorkout').value;
      render();
    };

    window.removeEx = (index) => {
      workouts[currentWorkout].splice(index, 1);
      saveUserData();
      render();
    };

    window.openDatabase = () => {
      document.getElementById('dbModal').style.display = 'block';
      renderDatabase();
    };

    window.closeDatabase = () => document.getElementById('dbModal').style.display = 'none';

    window.renderDatabase = () => {
      const filter = document.getElementById('dbGroupFilter').value;
      const dbList = document.getElementById('dbList');
      dbList.innerHTML = '';
      const filtered = filter === 'Todos' ? exerciseDB : exerciseDB.filter(e => e.group === filter);

      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'db-item';
        item.innerHTML = `<div><strong>${ex.name}</strong><div style="font-size:0.75rem; color:var(--subtext);">${ex.group}</div></div><span style="color:var(--accent); font-weight:bold;">+ Add</span>`;
        item.onclick = () => selectExerciseFromDB(ex);
        dbList.appendChild(item);
      });
    };

    function selectExerciseFromDB(ex) {
      if (!workouts[currentWorkout]) workouts[currentWorkout] = [];
      workouts[currentWorkout].push({ name: ex.name, video: '', reps: '3x10', tempo: '2010', rest: '60s', weight: '', obs: '' });
      saveUserData();
      closeDatabase();
      render();
    }

    window.startTimer = (seconds) => {
      clearInterval(timerInterval);
      const banner = document.getElementById('timerBanner');
      const clock = document.getElementById('timerClock');
      banner.style.display = 'block';
      let timeLeft = seconds;

      const updateClock = () => {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        clock.textContent = `${m}:${s}`;
      };
      updateClock();

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          clock.textContent = "TEMPO FIM!";
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          setTimeout(() => { banner.style.display = 'none'; }, 3000);
        } else {
          updateClock();
        }
      }, 1000);
    };
  </script>
</body>
</html>
